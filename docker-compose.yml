services:
  nextjs:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      # Only mount source files, not node_modules
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib
      - ./public:/app/public
      - ./styles:/app/styles
      - node_modules:/app/node_modules
      - nextjs_cache:/app/.next
    command: npm run dev

volumes:
  node_modules:
  nextjs_cache:
